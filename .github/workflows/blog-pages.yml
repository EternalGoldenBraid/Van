name: Publish van-build blog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blog-pages.yml
      - docs/blog/**
      - docs/diesel_heater/**
      - docs/wood_stove/**
      - docs/floor_plan.md
      - docs/floor_sealing_logbook.md

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the blog
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/blog/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/blog/requirements.txt

      - name: Build the blog
        run: >-
          sphinx-build -n -W --keep-going -b html
          docs/blog docs/blog/_build/html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/blog/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
