name: Publish van-build blog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blog-pages.yml
      - docs/blog/**
      - docs/diesel_heater/**
      - docs/wood_stove/**
      - docs/floor_plan.md
      - docs/floor_sealing_logbook.md
      - docs/window_plan.md
      - docs/roof_layout_plan.md
      - scripts/blog_review_preview.mjs
      - scripts/blog_review.test.mjs
      - scripts/shopping_graph.py

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the blog
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/blog/package-lock.json

      - name: Install documentation dependencies
        run: npm --prefix docs/blog ci --no-audit --no-fund

      - name: Set up Python for graph checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the blog
        run: npm --prefix docs/blog test

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/blog/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
